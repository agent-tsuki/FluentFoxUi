<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>FoxSensei — Learn Japanese Naturally</title>
    <meta name="description" content="Master Japanese through editorial-grade content, contextual immersion, and a distraction-free environment. Hiragana, Kanji, JLPT quiz — no gamified stress, just deep learning." />
    <meta name="keywords" content="learn Japanese, Japanese language, hiragana, kanji, JLPT, Japanese quiz, language learning" />
    <meta name="author" content="FoxSensei" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foxsensei.jp/" />
    <meta property="og:title" content="FoxSensei — Learn Japanese Naturally" />
    <meta property="og:description" content="Master Japanese through editorial-grade content, contextual immersion, and a distraction-free environment." />
    <meta property="og:image" content="/favicon/favicon-96x96.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://foxsensei.jp/" />
    <meta name="twitter:title" content="FoxSensei — Learn Japanese Naturally" />
    <meta name="twitter:description" content="Master Japanese through editorial-grade content, contextual immersion, and a distraction-free environment." />
    <meta name="twitter:image" content="/favicon/favicon-96x96.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#EA6B44" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts — preconnect first to cut DNS/TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Material Symbols, subset to the icons the app uses (~16 KB instead of ~4 MB).
      Axes are pinned to what src/index.css and <Icon> set: opsz 24, wght 400,
      GRAD 0, FILL 0..1 (the `filled` prop).
      ADDING AN ICON? Append its name to icon_names below, keeping the list
      sorted alphabetically (Google Fonts rejects unsorted lists), or it will
      render as its ligature text.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_circle,alarm,animation,arrow_back,arrow_forward,auto_stories,balance,bedtime,calculate,calendar_today,campaign,celebration,check,check_circle,checklist,chevron_right,child_care,close,cloud_off,dark_mode,dashboard,delete_forever,device_unknown,edit,edit_note,emoji_events,error,expand_more,favorite,filter_alt_off,filter_list,forum,gesture,grade,grid_view,group,headset,history_edu,home,inbox,info,keyboard_arrow_down,language,light_mode,lightbulb,link,link_off,local_fire_department,local_florist,location_on,lock,lock_reset,logout,mail,mark_email_read,mark_email_unread,menu,menu_book,mouse,password,payments,person,photo_camera,pin,play_circle,progress_activity,public,quiz,refresh,reviews,schedule,schema,school,search_off,set_meal,settings,smart_display,star,stars,style,thumb_down,thumb_up,timer,tips_and_updates,translate,travel_explore,unfold_more,verified,view_carousel,visibility,visibility_off,warning,waving_hand&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
