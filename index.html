<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>FoxSensei — Learn Japanese Naturally</title>
    <meta name="description" content="Learn to read Japanese step by step: hiragana and katakana courses, JLPT N5 and N4 kanji, illustrated N5 grammar and spaced-repetition reviews. Start free, no account needed." />
    <meta name="keywords" content="learn Japanese, hiragana, katakana, kanji, JLPT N5, JLPT N4, Japanese grammar, spaced repetition" />
    <meta name="author" content="FoxSensei" />
    <meta name="robots" content="index, follow" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://foxsensei.com/" />
    <meta property="og:site_name" content="FoxSensei" />
    <meta property="og:title" content="FoxSensei — Learn Japanese Naturally" />
    <meta property="og:description" content="Learn to read Japanese step by step: hiragana and katakana courses, JLPT N5 and N4 kanji, illustrated N5 grammar and spaced-repetition reviews. Start free, no account needed." />
    <meta property="og:image" content="https://foxsensei.com/favicon/web-app-manifest-512x512.png" />
    <meta property="og:image:alt" content="FoxSensei fox logo" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:url" content="https://foxsensei.com/" />
    <meta name="twitter:title" content="FoxSensei — Learn Japanese Naturally" />
    <meta name="twitter:description" content="Learn to read Japanese step by step: hiragana and katakana courses, JLPT N5 and N4 kanji, illustrated N5 grammar and spaced-repetition reviews. Start free, no account needed." />
    <meta name="twitter:image" content="https://foxsensei.com/favicon/web-app-manifest-512x512.png" />

    <!-- Theme color -->
    <meta name="theme-color" content="#BB4D2C" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon/favicon-96x96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts are self-hosted: src/styles/fonts.css (generated by npm run fonts from

         uses, and preloading would push every page's fonts onto every other page. -->
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
