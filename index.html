<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Light / dark before the first paint (no flash): the learner's own pick, else the device's
      // setting. Keep in step with UIContext (THEME_KEY). An old explicit dark pick ('darkMode' = true;
      // false was saved for every visitor, so it means nothing) becomes the new pick.
      (function () {
        var choice = null
        try {
          choice = localStorage.getItem('themeChoice')
          var old = localStorage.getItem('darkMode')
          if (old !== null) {
            if (!choice && old === 'true') localStorage.setItem('themeChoice', (choice = 'dark'))
            localStorage.removeItem('darkMode')
          }
        } catch (e) {}
        var dark = choice === 'dark' || (choice !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.classList.toggle('light', !dark)
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <title>Learn Japanese Free: Hiragana, Katakana &amp; Kanji | FoxSensei</title>
    <meta name="description" content="Learn to read Japanese step by step: hiragana and katakana courses, JLPT N5 and N4 kanji, illustrated N5 grammar and spaced-repetition reviews. Start free, no account needed." />
    <meta name="author" content="FoxSensei" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Open Graph / Facebook -->

    <meta property="og:url" content="https://foxsensei.com/" />
    <meta property="og:site_name" content="FoxSensei" />
    <meta property="og:title" content="Learn Japanese Free: Hiragana, Katakana &amp; Kanji | FoxSensei" />
    <meta property="og:description" content="Learn to read Japanese step by step: hiragana and katakana courses, JLPT N5 and N4 kanji, illustrated N5 grammar and spaced-repetition reviews. Start free, no account needed." />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://foxsensei.com/og/foxsensei-og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />

    <!-- Theme color -->

    <!-- Fonts are self-hosted: src/styles/fonts.css (generated by npm run fonts from
         scripts/fonts/sources.json). Not preloaded: each page loads only the faces it
         uses, and preloading would push every page's fonts onto every other page. -->
  </head>
